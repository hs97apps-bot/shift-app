<button onclick="moveWeek(-7)">← 前週</button><button onclick="todayWeek()">今週</button><button onclick="moveWeek(7)">次週 →</button><button onclick="copyPrev()">前週コピー</button><button class="primary" onclick="window.print()">印刷 / PDF</button></div><div class="card"><table id="shiftTable"></table></div><div class="settings" id="settings"><b>設定</b><div>店名</div><input id="storeInput"><div class="legacyManage"><b>スタッフ管理</b></div><div class="legacyManage"><div class="small">スタッフ名と、その人がよく使う勤務時間を登録します。</div><div id="staffManager"></div><button type="button" onclick="addStaffSetting()">＋ スタッフを追加</button><input id="staffInput" type="hidden"><div style="margin-top:12px"><b>共通設定</b></div><div>共通の勤務時間（任意・カンマ区切り）</div><input id="timesInput" placeholder="例：08-17, 17-22"><div>備考の定型項目（カンマ区切り）</div><input id="presetsInput"></div><div style="margin-top:14px"><b>店休日設定</b></div><div class="small">曜日の定休日と、臨時休業日を設定できます。店休日はシフト表を赤掛け表示します。</div><div class="chips" id="closedWeekdays" style="margin:8px 0"></div><label>臨時休業日（YYYY-MM-DD、カンマ区切り）</label><input id="closedDatesInput" placeholder="2026-10-20, 2026-10-27"><button class="primary" onclick="saveSettings()">保存</button><p class="small">土曜は青、日曜・日本の祝日は赤で自動表示。</p></div></main></div><div id="staffScreen" class="screen"><header><div class="top"><div class="title">スタッフ</div><button onclick="addStaffQuick()">＋追加</button></div></header><main class="wrap"><div id="staffAppList" class="card"></div></main></div><div id="notesScreen" class="screen"><header><div class="top"><div class="title">備考</div><button onclick="addNoteQuick()">＋追加</button></div></header><main class="wrap"><div id="notesAppList" class="card"></div></main></div><nav class="bottom"><button class="tab active" onclick="tabTo('shiftScreen',this)">シフト</button><button class="tab" onclick="tabTo('staffScreen',this)">スタッフ</button><button class="tab" onclick="tabTo('notesScreen',this)">備考</button><button class="tab" onclick="openSettingsTab(this)">店舗設定</button></nav><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel"><h3 id="modalTitle">編集</h3><div id="shiftEditor"><div class="small">スタッフと勤務時間を選択</div><div id="entries"></div><button type="button" onclick="addEntry()">＋ スタッフを追加</button></div><div id="closedCellControl" style="margin:8px 0"></div><textarea id="editText" rows="5" placeholder="メモ・例外入力（必要な時だけ）"></textarea><div id="shiftMemoStyle" class="noteStyleControls"><label>メモ文字サイズ <select id="memoFontSize"><option value="11">小</option><option value="14" selected>標準</option><option value="18">大</option><option value="22">特大</option></select></label><label>文字色 <input id="memoColor" type="color" value="#18202a"></label><label>太さ <select id="memoWeight"><option value="400">標準</option><option value="600">太字</option><option value="800">極太</option></select></label></div><div id="presetArea"><div class="small">定型項目</div><div class="chips" id="chips"></div><div class="noteStyleControls"><label>文字サイズ <select id="noteFontSize"><option value="11">小</option><option value="14" selected>標準</option><option value="18">大</option><option value="22">特大</option></select></label><label>文字色 <input id="noteColor" type="color" value="#18202a"></label><label>太さ <select id="noteWeight"><option value="400">標準</option><option value="600">太字</option><option value="800">極太</option></select></label></div></div><div class="toolbar"><button id="deleteShiftBtn" class="danger" onclick="deleteCell()">シフト削除</button><button onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveCell()">保存</button></div></div></div><script>const rows=['日勤','夕勤','夜勤','備考'];let start=getSunday(new Date()),activeKey='';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}let data=load('shiftData',{}),appSettings=load('shiftSettings',{store:'MT カフェ',staff:['タマ','斉藤','サヒ'],times:['08-17','17-22','22-08'],presets:['チーム会議','ミーテ rue;return isClosedDay(d)}function renderClosedWeekdays(){let box=document.getElementById('closedWeekdays');if(!box)return;box.innerHTML='';['日','月','火','水','木','金','土'].forEach((n,i)=>{let b=document.createElement('button');b.type='button';b.className='chip'+((appSettings.closedWeekdays||[]).includes(i)?' sel':'');b.textContent=n;b.dataset.day=i;b.onclick=()=>b.classList.toggle('sel');box.appendChild(b)})}function parseShiftLines(raw){return String(raw||'').split('\n').map(line=>{let m=line.match(/^(\d{1,2}(?::\d{2})?)-(\d{1,2}(?::\d{2})?)\s+(.+)$/);return m?{start:m[1],end:m[2],staff:m[3],raw:line}:null}).filter(Boolean)}function displayShiftValue(d,rowIndex,raw){let parsed=parseShiftLines(raw);if(!parsed.length)return null;let prev=rowIndex>0?parseShiftLines(data[ymd(d)+'|'+rows[rowIndex-1]]||''):[];return parsed.map(x=>{let match=prev.find(p=>p.staff===x.staff&&p.end===x.start);return (match?'-'+x.end:x.start+'-'+x.end)+' '+x.staff}).join('\n')}function render(){document.getElementById('storeTitle').textContent=appSettings.store+'　シフト表';let ds=[...Array(7)].map((_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d}),names=['日','月','火','水','木','金','土'];document.getElementById('weekLabel').textContent=ds[0].getFullYear()+'年 '+(ds[0].getMonth()+1)+'/'+ds[0].getDate()+' 〜 '+(ds[6].getMonth()+1)+'/'+ds[6].getDate();let h='<tr><th class="rowhead"></th>';ds.forEach((d,i)=>{let c=jpHoliday(d)?'holiday':d.getDay()===0?'sun':d.getDay()===6?'sat':'';h+='<th class="'+c+'">'+names[i]+'<br><b>'+d.getDate()+'</b></th>'});h+='</tr>';rows.forEach(r=>{h+='<tr><td class="rowhead">'+r+'</td>';ds.forEach(d=>{let k=ymd(d)+'|'+r,raw=data[k]||'',ri=rows.indexOf(r),autoDisplay=ri>=0?displayShiftValue(d,ri,raw):null;if(autoDisplay!==null)raw=autoDisplay;let ns=(appSettings.noteStyles||{})[k]||{},ms=(appSettings.shiftMemoStyles||{})[k]||{},sty=r==='備考'?' style="font-size:'+(ns.size||14)+'px;color:'+(ns.color||'#18202a')+';font-weight:'+(ns.weight||400)+'"':'';let v;if(r==='備考'){v=raw.replaceAll('<','&lt;').replaceAll('>','&gt;')}else{let shiftLines=[],memoLines=[];raw.split('\n').filter(Boolean).forEach(line=>{let m=line.match(/^(\S+)\s+(.+)$/);if(m&&(appSettings.staff||[]).includes(m[2])&&timesForStaff(m[2]).includes(m[1]))shiftLines.push(line);else memoLines.push(line)});v=shiftLines.map(x=>esc(x)).join('<br>')+(memoLines.length?(shiftLines.length?'<br>':'')+'<span style="font-size:'+(ms.size||14)+'px;color:'+(ms.color||'#18202a')+';font-weight:'+(ms.weight||400)+'">'+memoLines.map(x=>esc(x)).join('<br>')+'</span>':'')}let closedCell=isCellClosed(d,r);h+='<td class="cell'+(closedCell?' closedDay':'')+'"'+sty+' data-key="'+k+'" data-row="'+r+'">'+v+(closedCell&&r!=='備考'?'<span class="closedBadge">店休</span>':'')+'</td>'});h+='</tr>'});document.getElementById('shiftTable').innerHTML=h;document.querySelectorAll('.cell').forEach(e=>e.onclick=()=>editCell(e.dataset.key,e.dataset.row));document.getElementById('storeInput').value=appSettings.store;let si=document.getElementById('staffInput');if(si)si.value=(appSettings.staff||[]).join(', ');let ti=document.getElementById('timesInput');if(ti)ti.value=(appSettings.times||[]).join(', ');let pi=document.getElementById('presetsInput');if(pi)pi.value=appSettings.presets.join(', ');let ci=document.getElementById('closedDatesInput');if(ci)ci.value=(appSettings.closedDates||[]).join(', ');renderClosedWeekdays();renderStaffPresetSettings()}function staffRow(name,times){let row=document.createElement('div');row.className='staffManageRow';row.innerHTML='<input class="staffNameEdit" placeholder="スタッフ名" value="'+esc(name||'')+'"><input class="staffTimesEdit" placeholder="08-17, 08-22" value="'+esc((times||[]).join(', '))+'"><button type="button" class="danger">×</button>';row.querySelector('.danger').onclick=()=>row.remove();return row}function renderStaffPresetSettings(){let box=document.getElementById('staffManager');if(!box)return;box.innerHTML='';(appSettings.staff||[]).forEach(name=>box.appendChild(staffRow(name,(appSettings.staffTimes&&appSettings.staffTimes[name])||[])))}function addStaffSetting(){document.getElementById('staffManager').appendChild(staffRow('',[]))}function timesForStaff(name){let own=(appSettings.staffTimes&&appSettings.staffTimes[name])||[];return [...new Set([...own,...(appSettings.times||[])])]}function refreshEntryTimes(sel){let row=sel.closest('.entry'),timeSel=row.querySelector('.entryTime'),old=timeSel.value,arr=timesForStaff(sel.value);timeSel.innerHTML=optionList(arr,old);if(!arr.includes(old)&&arr.length)timeSel.value=arr[0]}function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function optionList(arr,selected){return arr.map(x=>'<option '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}function splitTime(v){let m=String(v||'').match(/^(\d{1,2})(?::(\d{2}))?-(\d{1,2})(?::(\d{2}))?$/);return m?[(m[1].padStart(2,'0')+':'+(m[2]||'00')),(m[3].padStart(2,'0')+':'+(m[4]||'00'))]:['','']}function compactTime(a,b){let norm=x=>x.endsWith(':00')?x.slice(0,2):x;return norm(a)+'-'+norm(b)}function addEntry(staff,time){let staffList=appSettings.staff||[];let chosen=staff&&staffList.includes(staff)?staff:(staffList[0]||'');let preset=time||timesForStaff(chosen)[0]||'',parts=splitTime(preset);let div=document.createElement('div');div.className='entry';div.innerHTML='<select class="entryTime">'+optionList(timesForStaff(chosen),preset)+'</select><select class="entryStaff">'+optionList(staffList,chosen)+'</select><button type="button" class="danger">×</button><div class="timeAdjust"><input class="startTime" type="time" value="'+parts[0]+'"><input class="endTime" type="time" value="'+parts[1]+'"></div>';div.querySelector('.entryStaff').onchange=e=>{refreshEntryTimes(e.target);let p=splitTime(div.querySelector('.entryTime').value);div.querySelector('.startTime').value=p[0];div.querySelector('.endTime').value=p[1]};div.querySelector('.entryTime').onchange=e=>{let p=splitTime(e.target.value);div.querySelector('.startTime').value=p[0];div.querySelector('.endTime').value=p[1]};div.querySelector('.danger').onclick=()=>div.remove();document.getElementById('entries').appendChild(div)}function editCell(k,r){activeKey=k;document.getElementById('modalTitle').textContent=k.slice(5,10)+' '+r+' を編集';let current=data[k]||'';let db=document.getElementById('deleteShiftBtn');if(db){db.style.display=current.trim()?'inline-block':'none';db.textContent=r==='備考'?'備考を削除':'シフト削除'}document.getElementById('entries').innerHTML='';document.getElementById('chips').innerHTML='';renderClosedCellControl(k,r);if(r==='備考'){document.getElementById('shiftEditor').style.display='none';document.getElementById('presetArea').style.display='block';document.getElementById('editText').value=current;let ns=(appSettings.noteStyles||{})[k]||{};document.getElementById('noteFontSize').value=String(ns.size||14);document.getElementById('noteColor').value=ns.color||'#18202a';document.getElementById('noteWeight').value=String(ns.weight||400);document.getElementById('shiftMemoStyle').style.display='none';appSettings.presets.forEach(x=>{let btn=document.createElement('button');btn.className='chip';btn.textContent=x;btn.onclick=()=>{let t=document.getElementById('editText');t.value+=(t.value?'\n':'')+x};document.getElementById('chips').appendChild(btn)})}else{document.getElementById('shiftEditor').style.display='block';document.getElementById('presetArea').style.display='none';document.getElementById('editText').value='';document.getElementById('shiftMemoStyle').style.display='flex';let ms=(appSettings.shiftMemoStyles||{})[k]||{};document.getElementById('memoFontSize').value=String(ms.size||14);document.getElementById('memoColor').value=ms.color||'#18202a';document.getElementById('memoWeight').value=String(ms.weight||400);let extras=[];current.split('\n').filter(Boolean).forEach(line=>{let m=line.match(/^(\S+)\s+(.+)$/),staff=m&&appSettings.staff.includes(m[2]),times=m&&timesForStaf
