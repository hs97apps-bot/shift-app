<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト管理</title><link rel="stylesheet" href="style.css"></head><body><div class="app">
<section id="shift" class="screen active"><header><div class="top"><div><div class="title" id="storeTitle"></div><div class="small">rebuild v2</div></div><button class="btn" onclick="print()">PDF</button></div><div class="bar"><button class="btn" onclick="move(-7)">←</button><b id="week"></b><button class="btn" onclick="move(7)">→</button><button class="btn" onclick="today()">今週</button></div></header><div class="wrap"><div class="card"><table id="table"></table></div><div class="bar"><button class="btn" onclick="copyPrev()">前週コピー</button></div></div></section>
<section id="staff" class="screen"><header><div class="top"><div class="title">スタッフ</div><button class="btn primary" onclick="staffOpen(-1)">＋追加</button></div></header><div id="staffList"></div></section>
<section id="notes" class="screen"><header><div class="top"><div class="title">備考</div><button class="btn primary" onclick="notePresetAdd()">＋追加</button></div></header><div id="notesList"></div></section>
<section id="store" class="screen"><header><div class="title">店舗設定</div></header><div class="wrap"><div class="field"><label>店名</label><input id="storeName"></div><div class="field"><label>勤務区分と時間（カンマ区切り）</label><input id="rowNames" placeholder="日勤 08:00-17:00, 夕勤 17:00-22:00, 夜勤 22:00-08:00"><div class="small">ここで設定した時間帯に合わせて、入力したシフトを自動で各区分へ反映します。</div></div><div class="field"><label>定休日</label><div id="closedWeekdays" class="chips"></div></div><div class="field"><label>臨時店休日（YYYY-MM-DD、カンマ区切り）</label><input id="closedDates"></div><button class="btn primary" onclick="storeSave()">保存</button></div></section>
<nav class="bottom"><button class="tab active" data-id="shift">シフト</button><button class="tab" data-id="staff">スタッフ</button><button class="tab" data-id="notes">備考</button><button class="tab" data-id="store">店舗設定</button></nav></div>
<div id="edit" class="modal"><div class="sheet"><h2 id="editTitle"></h2><div id="shiftBox"><div id="entries"></div><button class="btn" onclick="entryAdd()">＋スタッフを追加</button><div class="field"><label>メモ</label><textarea id="memo"></textarea></div><div class="grid"><select id="memoSize"><option value="11">小</option><option value="14">標準</option><option value="18">大</option><option value="22">特大</option></select><input id="memoColor" type="color"><select id="memoWeight"><option value="400">標準</option><option value="600">太字</option><option value="800">極太</option></select></div><div id="closeCell"></div></div><div id="noteBox"><div id="noteChips" class="chips"></div><div class="field"><label>備考</label><textarea id="noteText"></textarea></div><div class="grid"><select id="noteSize"><option value="11">小</option><option value="14">標準</option><option value="18">大</option><option value="22">特大</option></select><input id="noteColor" type="color"><select id="noteWeight"><option value="400">標準</option><option value="600">太字</option><option value="800">極太</option></select></div></div><div class="save"><button class="btn danger" id="cellDelete" onclick="cellDel()">削除</button><button class="btn" onclick="hide('edit')">閉じる</button><button class="btn primary" onclick="cellSave()">保存</button></div></div></div>
<div id="staffModal" class="modal"><div class="sheet"><h2>スタッフ</h2><div class="field"><label>名前</label><input id="staffName"></div><div class="field"><label>勤務時間プリセット</label><div id="staffTimes"></div></div><button class="btn" onclick="staffTimeAdd()">＋時間追加</button><div class="save"><button class="btn danger" onclick="staffDel()">削除</button><button class="btn" onclick="hide('staffModal')">閉じる</button><button class="btn primary" onclick="staffSave()">保存</button></div></div></div>
<script src="app.js"></script></body></html>
