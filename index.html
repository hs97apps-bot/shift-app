<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト表</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;color:#18202a}header{background:#fff;border-bottom:1px solid #ddd;padding:12px;position:sticky;top:0;z-index:3}.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}.title{font-weight:800;font-size:20px}.week{font-size:13px;color:#667}.wrap{max-width:1100px;margin:14px auto;padding:0 10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button{border:0;border-radius:10px;padding:10px 13px;background:#eaf2ff;color:#1267d6;font-weight:700}.primary{background:#1677ff;color:white}.card{background:white;border-radius:14px;overflow:auto;box-shadow:0 2px 12px #0000000d}table{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}th,td{border:1px solid #d9dde2;text-align:center}th{background:#eef1f3;padding:8px}.rowhead{width:70px;background:#e7eaed;font-weight:700}.cell{height:105px;padding:5px;white-space:pre-line;cursor:pointer}.sat{color:#1677ff}.sun,.holiday{color:#e53935}.settings{display:none;background:white;padding:16px;border-radius:14px;margin-top:12px}.settings input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd2d8;border-radius:9px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:end;justify-content:center}.panel{background:#fff;width:min(560px,100%);padding:20px;border-radius:18px 18px 0 0}.panel textarea{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:10px;font:inherit}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:#f0f3f6;color:#333}.shiftEditor{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.shiftEditor select{width:100%;padding:11px;border:1px solid #ccd2d8;border-radius:10px;background:white}.entry{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:7px 0}.entry select{padding:9px;border:1px solid #ccd2d8;border-radius:9px;background:white}.danger{background:#fff0f0;color:#d33;padding:8px 10px}.staffPresetRow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:7px 0}.staffPresetRow input{margin:0}.staffPresetName{font-weight:700}.staffManageRow{display:grid;grid-template-columns:1fr 1.5fr auto;gap:6px;margin:8px 0}.staffManageRow input{margin:0!important}.staffManageRow button{padding:8px 10px}.small{font-size:12px;color:#68727c}@media(max-width:600px){.title{font-size:17px}.cell{height:92px;font-size:12px}.rowhead{width:56px}}</style></head><body><header><div class="top"><div><div class="title" id="storeTitle"></div><div class="week" id="weekLabel"></div></div><button onclick="toggleSettings()">設定</button></div></header><main class="wrap"><div class="toolbar"><button onclick="moveWeek(-7)">← 前週</button><button onclick="todayWeek()">今週</button><button onclick="moveWeek(7)">次週 →</button><button onclick="copyPrev()">前週コピー</button><button class="primary" onclick="window.print()">印刷 / PDF</button></div><div class="card"><table id="shiftTable"></table></div><div class="settings" id="settings"><b>設定</b><div>店名</div><input id="storeInput"><div><b>スタッフ管理</b></div><div class="small">スタッフ名と、その人がよく使う勤務時間を登録します。</div><div id="staffManager"></div><button type="button" onclick="addStaffSetting()">＋ スタッフを追加</button><input id="staffInput" type="hidden"><div style="margin-top:12px"><b>共通設定</b></div><div>共通の勤務時間（任意・カンマ区切り）</div><input id="timesInput" placeholder="例：08-17, 17-22"><div>備考の定型項目（カンマ区切り）</div><input id="presetsInput"><button class="primary" onclick="saveSettings()">保存</button><p class="small">土曜は青、日曜・日本の祝日は赤で自動表示。</p></div></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel"><h3 id="modalTitle">編集</h3><div id="shiftEditor"><div class="small">スタッフと勤務時間を選択</div><div id="entries"></div><button type="button" onclick="addEntry()">＋ スタッフを追加</button></div><textarea id="editText" rows="5" placeholder="自由入力もできます"></textarea><div id="presetArea"><div class="small">定型項目</div><div class="chips" id="chips"></div></div><div class="toolbar"><button onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveCell()">保存</button></div></div></div><script>const rows=['日勤','夕勤','夜勤','備考'];let start=getSunday(new Date()),activeKey='';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}let data=load('shiftData',{}),appSettings=load('shiftSettings',{store:'MT カフェ',staff:['タマ','斉藤','サヒ'],times:['08-17','17-22','22-08'],presets:['チーム会議','ミーティング','棚卸し','業者対応','新人研修','定休日']});if(!appSettings.staffTimes)appSettings.staffTimes={};function getSunday(d){d=new Date(d);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function holidaySet(y){const set=new Set();const key=(m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');const add=(m,d)=>set.add(key(m,d));const nthMonday=(m,n)=>{const first=new Date(y,m-1,1).getDay();const firstMon=1+((1-first+7)%7);return firstMon+7*(n-1)};[[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>add(m,d));add(1,nthMonday(1,2));add(7,nthMonday(7,3));add(9,nthMonday(9,3));add(10,nthMonday(10,2));add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));const originals=[...set];for(const k of originals){let d=new Date(k+'T00:00:00');if(d.getDay()===0){do{d.setDate(d.getDate()+1)}while(set.has(ymd(d)));set.add(ymd(d))}}for(let m=1;m<=12;m++){const last=new Date(y,m,0).getDate();for(let d=2;d<last;d++){const cur=new Date(y,m-1,d),prev=new Date(y,m-1,d-1),next=new Date(y,m-1,d+1);if(!set.has(ymd(cur))&&set.has(ymd(prev))&&set.has(ymd(next)))set.add(ymd(cur))}}return set}function jpHoliday(d){return holidaySet(d.getFullYear()).has(ymd(d))}function render(){document.getElementById('storeTitle').textContent=appSettings.store+'　シフト表';let ds=[...Array(7)].map((_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d}),names=['日','月','火','水','木','金','土'];document.getElementById('weekLabel').textContent=ds[0].getFullYear()+'年 '+(ds[0].getMonth()+1)+'/'+ds[0].getDate()+' 〜 '+(ds[6].getMonth()+1)+'/'+ds[6].getDate();let h='<tr><th class="rowhead"></th>';ds.forEach((d,i)=>{let c=jpHoliday(d)?'holiday':d.getDay()===0?'sun':d.getDay()===6?'sat':'';h+='<th class="'+c+'">'+names[i]+'<br><b>'+d.getDate()+'</b></th>'});h+='</tr>';rows.forEach(r=>{h+='<tr><td class="rowhead">'+r+'</td>';ds.forEach(d=>{let k=ymd(d)+'|'+r,v=(data[k]||'').replaceAll('<','&lt;').replaceAll('>','&gt;');h+='<td class="cell" data-key="'+k+'" data-row="'+r+'">'+v+'</td>'});h+='</tr>'});document.getElementById('shiftTable').innerHTML=h;document.querySelectorAll('.cell').forEach(e=>e.onclick=()=>editCell(e.dataset.key,e.dataset.row));document.getElementById('storeInput').value=appSettings.store;document.getElementById('staffInput').value=(appSettings.staff||[]).join(', ');document.getElementById('timesInput').value=(appSettings.times||[]).join(', ');document.getElementById('presetsInput').value=appSettings.presets.join(', ');renderStaffPresetSettings()}function staffRow(name,times){let row=document.createElement('div');row.className='staffManageRow';row.innerHTML='<input class="staffNameEdit" placeholder="スタッフ名" value="'+esc(name||'')+'"><input class="staffTimesEdit" placeholder="08-17, 08-22" value="'+esc((times||[]).join(', '))+'"><button type="button" class="danger">×</button>';row.querySelector('.danger').onclick=()=>row.remove();return row}function renderStaffPresetSettings(){let box=document.getElementById('staffManager');if(!box)return;box.innerHTML='';(appSettings.staff||[]).forEach(name=>box.appendChild(staffRow(name,(appSettings.staffTimes&&appSettings.staffTimes[name])||[])))}function addStaffSetting(){document.getElementById('staffManager').appendChild(staffRow('',[]))}function timesForStaff(name){let own=(appSettings.staffTimes&&appSettings.staffTimes[name])||[];return [...new Set([...own,...(appSettings.times||[])])]}function refreshEntryTimes(sel){let row=sel.closest('.entry'),timeSel=row.querySelector('.entryTime'),old=timeSel.value,arr=timesForStaff(sel.value);timeSel.innerHTML=optionList(arr,old);if(!arr.includes(old)&&arr.length)timeSel.value=arr[0]}function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function optionList(arr,selected){return arr.map(x=>'<option '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}function addEntry(staff,time){let staffList=appSettings.staff||[];let chosen=staff&&staffList.includes(staff)?staff:(staffList[0]||'');let div=document.createElement('div');div.className='entry';div.innerHTML='<select class="entryTime">'+optionList(timesForStaff(chosen),time)+'</select><select class="entryStaff">'+optionList(staffList,chosen)+'</select><button type="button" class="danger">×</button>';div.querySelector('.entryStaff').onchange=e=>refreshEntryTimes(e.target);div.querySelector('.danger').onclick=()=>div.remove();document.getElementById('entries').appendChild(div)}function editCell(k,r){activeKey=k;document.getElementById('modalTitle').textContent=k.slice(5,10)+' '+r+' を編集';document.getElementById('editText').value=data[k]||'';document.getElementById('presetArea').style.display=r==='備考'?'block':'none';document.getElementById('shiftEditor').style.display=r==='備考'?'none':'block';document.getElementById('entries').innerHTML='';if(r!=='備考'){let lines=(data[k]||'').split('\n').filter(Boolean),matched=false;lines.forEach(line=>{let m=line.match(/^(\S+)\s+(.+)$/);if(m&&(appSettings.times||[]).includes(m[1])&&(appSettings.staff||[]).includes(m[2])){addEntry(m[2],m[1]);matched=true}});if(!matched)addEntry()}document.getElementById('chips').innerHTML='';appSettings.presets.forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{let t=document.getElementById('editText');t.value+=(t.value?'\n':'')+x};document.getElementById('chips').appendChild(b)});document.getElementById('modal').style.display='flex'}function saveCell(){let row=activeKey.split('|')[1],free=document.getElementById('editText').value.trim();if(row!=='備考'){let lines=[...document.querySelectorAll('.entry')].map(e=>e.querySelector('.entryTime').value+' '+e.querySelector('.entryStaff').value).filter(x=>x.trim());data[activeKey]=lines.join('\n')+(free?(lines.length?'\n':'')+free:'')}else data[activeKey]=free;persist('shiftData',data);closeModal();render()}function closeModal(){document.getElementById('modal').style.display='none'}function moveWeek(n){start.setDate(start.getDate()+n);render()}function todayWeek(){start=getSunday(new Date());render()}function toggleSettings(){let el=document.getElementById('settings');el.style.display=el.style.display==='block'?'none':'block'}function saveSettings(){appSettings.store=document.getElementById('storeInput').value||'シフト';let staff=[],staffTimes={};document.querySelectorAll('#staffManager .staffManageRow').forEach(row=>{let name=row.querySelector('.staffNameEdit').value.trim();if(!name)return;staff.push(name);staffTimes[name]=row.querySelector('.staffTimesEdit').value.split(',').map(x=>x.trim()).filter(Boolean)});appSettings.staff=staff;appSettings.staffTimes=staffTimes;appSettings.times=document.getElementById('timesInput').value.split(',').map(x=>x.trim()).filter(Boolean);appSettings.presets=document.getElementById('presetsInput').value.split(',').map(x=>x.trim()).filter(Boolean);persist('shiftSettings',appSettings);render();alert('設定を保存しました')} function copyPrev(){if(!confirm('前週の内容を今週へコピーしますか？'))return;rows.forEach(r=>{for(let i=0;i<7;i++){let a=new Date(start),b=new Date(start);a.setDate(a.getDate()+i);b.setDate(b.getDate()+i-7);let v=data[ymd(b)+'|'+r];if(v)data[ymd(a)+'|'+r]=v}});persist('shiftData',data);render()}render();</script></body></html>
