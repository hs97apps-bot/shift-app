<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト表</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;color:#18202a}header{background:#fff;border-bottom:1px solid #ddd;padding:12px;position:sticky;top:0;z-index:3}.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}.title{font-weight:800;font-size:20px}.week{font-size:13px;color:#667}.wrap{max-width:1100px;margin:14px auto;padding:0 10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button{border:0;border-radius:10px;padding:10px 13px;background:#eaf2ff;color:#1267d6;font-weight:700}.primary{background:#1677ff;color:white}.card{background:white;border-radius:14px;overflow:auto;box-shadow:0 2px 12px #0000000d}table{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}th,td{border:1px solid #d9dde2;text-align:center}th{background:#eef1f3;padding:8px}.rowhead{width:70px;background:#e7eaed;font-weight:700}.cell{height:105px;padding:5px;white-space:pre-line;cursor:pointer}.sat{color:#1677ff}.sun,.holiday{color:#e53935}.settings{display:none;background:white;padding:16px;border-radius:14px;margin-top:12px}.settings input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd2d8;border-radius:9px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:end;justify-content:center}.panel{background:#fff;width:min(560px,100%);padding:20px;border-radius:18px 18px 0 0}.panel textarea{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:10px;font:inherit}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:#f0f3f6;color:#333}.small{font-size:12px;color:#68727c}@media(max-width:600px){.title{font-size:17px}.cell{height:92px;font-size:12px}.rowhead{width:56px}}</style></head><body><header><div class="top"><div><div class="title" id="storeTitle"></div><div class="week" id="weekLabel"></div></div><button onclick="toggleSettings()">設定</button></div></header><main class="wrap"><div class="toolbar"><button onclick="moveWeek(-7)">← 前週</button><button onclick="todayWeek()">今週</button><button onclick="moveWeek(7)">次週 →</button><button onclick="copyPrev()">前週コピー</button><button class="primary" onclick="window.print()">印刷 / PDF</button></div><div class="card"><table id="shiftTable"></table></div><div class="settings" id="settings"><b>設定</b><div>店名</div><input id="storeInput"><div>備考の定型項目（カンマ区切り）</div><input id="presetsInput"><button class="primary" onclick="saveSettings()">保存</button><p class="small">土曜は青、日曜・日本の祝日は赤で自動表示。</p></div></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel"><h3 id="modalTitle">編集</h3><textarea id="editText" rows="5" placeholder="例：08-22 タマ"></textarea><div id="presetArea"><div class="small">定型項目</div><div class="chips" id="chips"></div></div><div class="toolbar"><button onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveCell()">保存</button></div></div></div><script>const rows=['日勤','夕勤','夜勤','備考'];let start=getMonday(new Date()),activeKey='';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}let data=load('shiftData',{}),settings=load('shiftSettings',{store:'MT カフェ',presets:['チーム会議','ミーティング','棚卸し','業者対応','新人研修','定休日']});function getMonday(d){d=new Date(d);let w=d.getDay();d.setDate(d.getDate()-w+(w===0?-6:1));d.setHours(0,0,0,0);return d}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function jpHoliday(d){let y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate(),w=d.getDay(),fixed=[[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]];if(fixed.some(x=>x[0]==m&&x[1]==n))return true;let nth=(k,wd)=>Math.ceil((n+(new Date(y,m-1,1).getDay()-wd+7)%7)/7)===k&&w===wd;if((m===1&&nth(2,1))||(m===7&&nth(3,1))||(m===9&&nth(3,1))||(m===10&&nth(2,1)))return true;let ve=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),ae=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));return(m===3&&n===ve)||(m===9&&n===ae)}function render(){document.getElementById('storeTitle').textContent=settings.store+'　シフト表';let ds=[...Array(7)].map((_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d}),names=['月','火','水','木','金','土','日'];document.getElementById('weekLabel').textContent=ds[0].getFullYear()+'年 '+(ds[0].getMonth()+1)+'/'+ds[0].getDate()+' 〜 '+(ds[6].getMonth()+1)+'/'+ds[6].getDate();let h='<tr><th class="rowhead"></th>';ds.forEach((d,i)=>{let c=d.getDay()===0?'sun':d.getDay()===6?'sat':jpHoliday(d)?'holiday':'';h+='<th class="'+c+'">'+names[i]+'<br><b>'+d.getDate()+'</b></th>'});h+='</tr>';rows.forEach(r=>{h+='<tr><td class="rowhead">'+r+'</td>';ds.forEach(d=>{let k=ymd(d)+'|'+r,v=(data[k]||'').replaceAll('<','&lt;').replaceAll('>','&gt;');h+='<td class="cell" data-key="'+k+'" data-row="'+r+'">'+v+'</td>'});h+='</tr>'});document.getElementById('shiftTable').innerHTML=h;document.querySelectorAll('.cell').forEach(e=>e.onclick=()=>editCell(e.dataset.key,e.dataset.row));storeInput.value=settings.store;presetsInput.value=settings.presets.join(', ')}function editCell(k,r){activeKey=k;modalTitle.textContent=k.slice(5,10)+' '+r+' を編集';editText.value=data[k]||'';presetArea.style.display=r==='備考'?'block':'none';chips.innerHTML='';settings.presets.forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>editText.value+=(editText.value?'\n':'')+x;chips.appendChild(b)});modal.style.display='flex'}function saveCell(){data[activeKey]=editText.value;persist('shiftData',data);closeModal();render()}function closeModal(){modal.style.display='none'}function moveWeek(n){start.setDate(start.getDate()+n);render()}function todayWeek(){start=getMonday(new Date());render()}function toggleSettings(){settings.style.display=settings.style.display==='block'?'none':'block'}function saveSettings(){settings.store=storeInput.value||'シフト';settings.presets=presetsInput.value.split(',').map(x=>x.trim()).filter(Boolean);persist('shiftSettings',settings);render()}function copyPrev(){if(!confirm('前週の内容を今週へコピーしますか？'))return;rows.forEach(r=>{for(let i=0;i<7;i++){let a=new Date(start),b=new Date(start);a.setDate(a.getDate()+i);b.setDate(b.getDate()+i-7);let v=data[ymd(b)+'|'+r];if(v)data[ymd(a)+'|'+r]=v}});persist('shiftData',data);render()}render();</script></body></html>
